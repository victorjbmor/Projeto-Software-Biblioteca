spring.application.name=biblioteca

# Banco em memoria (os dados somem ao reiniciar)
spring.datasource.url=jdbc:h2:mem:biblioteca
spring.h2.console.enabled=true

# Evita consultas ao banco depois que o service terminou (fora da transacao)
spring.jpa.open-in-view=false

# JWT: em producao, defina a variavel de ambiente JWT_SECRET (minimo 32 caracteres)
jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-123456}
jwt.expiracao-minutos=60

# Admin criado ao iniciar (apenas para desenvolvimento)
biblioteca.admin.email=${ADMIN_EMAIL:admin@biblioteca.com}
biblioteca.admin.senha=${ADMIN_SENHA:admin123}
